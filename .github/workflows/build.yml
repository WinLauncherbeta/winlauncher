
name: Build WinLauncher APK

on:
  push:
    paths:
      - 'project (1).zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          set -e
          test -f "project (1).zip"
          mkdir proj
          unzip -q "project (1).zip" -d proj

      - name: Localizar WinLauncher principal
        run: |
          set -e
          ROOT="proj"

          if ! find "$ROOT/app" -maxdepth 1 -type f \( -name build.gradle -o -name build.gradle.kts \) -exec grep -l 'com.example.winlauncher' {} \; | grep -q .; then
            echo "O projeto principal não foi encontrado diretamente em proj/app."
            exit 1
          fi

          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "O settings.gradle não foi encontrado em proj."
            exit 1
          fi

          echo "Projeto principal confirmado em proj"
          echo "PROJECT_DIR=proj" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar WinLauncher
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: WinLauncher-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


