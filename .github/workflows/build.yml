
name: Build WinLauncher APK

on:
  push:
    paths:
      - 'project (1).zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar WinLauncher principal
        run: |
          set -e
          test -f "project (1).zip"
          mkdir proj
          unzip -q "project (1).zip" -d proj

          MATCHES=""
          while IFS= read -r SETTINGS; do
            ROOT="$(dirname "$SETTINGS")"
            for APP in "$ROOT"/app/build.gradle "$ROOT"/app/build.gradle.kts; do
              if [ -f "$APP" ] && grep -q 'com.example.winlauncher' "$APP"; then
                MATCHES="${MATCHES}${ROOT}"$'\n'
              fi
            done
          done < <(find proj -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          COUNT=$(printf '%s' "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "Erro: esperado exatamente um projeto WinLauncher principal. Encontrados: $COUNT"
            exit 1
          fi

          PROJECT_DIR=$(printf '%s' "$MATCHES" | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "WinLauncher principal localizado: $PROJECT_DIR"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar WinLauncher
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: WinLauncher-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
