
name: Build WinLauncher APK

on:
  push:
    paths:
      - 'project (1).zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto completo
        run: |
          set -e
          test -f "project (1).zip"
          mkdir projeto
          unzip -q "project (1).zip" -d projeto
          GRADLE_FILE=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$GRADLE_FILE"
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: WinLauncher-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

